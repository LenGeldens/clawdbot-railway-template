name: Docker build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check wrapper
        run: |
          npm ci
          npm run lint
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no push). If this fails, the PR breaks container builds.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: openclaw-railway-template:ci
          cache-from: type=gha
          # Cache upload is optional; image build and container smoke still fail
          # the job on any error. Large source layers can make uploads slow.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Start image and verify gateway and persistence
        run: node scripts/container-smoke.mjs openclaw-railway-template:ci
