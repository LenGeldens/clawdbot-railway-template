name: Bump OpenClaw release ref

on:
  schedule:
    - cron: "23 9 * * *" # daily 09:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin the official release tag and verified commit
        run: node scripts/bump-openclaw-ref.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump pinned OpenClaw release source"
          title: "chore: bump pinned OpenClaw release source"
          body: |
            Automated update of the official OpenClaw release tag and immutable commit SHA.

            Run the Docker build workflow on this branch before merging. GitHub may suppress
            workflows on PRs created with GITHUB_TOKEN; use workflow_dispatch when needed.
            Review Node/Bun requirements, back up state and review migrations before deployment.
          branch: chore/bump-openclaw-ref
          delete-branch: true
          labels: |
            automated
            dependencies
